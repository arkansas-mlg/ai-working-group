- id: anthropic-ai-for-science
  title: Anthropic AI for Science Program
  provider: Anthropic
  type: Model and API credits
  summary: Claude credits to accelerate high-impact scientific research across scientific fields. Potential fits include AI for scientific discovery, natural sciences, and mathematical research.
  eligibility: Academic and nonprofit researchers proposing scientific work that AI can meaningfully accelerate may apply. Applicants need institutional consent and must satisfy program rules and biosecurity review; engineering proposals should explain their scientific contribution.
  access: Submit scientific credentials and a research proposal using the application linked from the program announcement. Selected projects receive up to $50,000 in Claude credits assigned to the organization identified in the application.
  status: Rolling
  url: https://www.anthropic.com/news/expanding-support-for-scientists
  last_checked: "2026-10-25"
  details:
    - "Applications are evaluated monthly. The current application welcomes natural-science and mathematics projects."
    - "Credits apply to the offering specified by the award and expire as stated when issued, or after one calendar year if no expiry is specified."
    - "Standard usage policies apply. The August 2026 expansion announcement limits biology and chemistry work to Opus-class models."
    - "Recipients participate in research surveys and interviews; Anthropic may analyze transcripts and publish anonymized, aggregated findings."
    - "Prepaid API usage requires additional credits after exhaustion. Optional auto-reload and invoiced accounts can create charges beyond the award."

# No-cost access without a proposal/allocation: https://osg-htc.org/
# Account application: https://portal.osg-htc.org/application
# Onboarding: https://portal.osg-htc.org/documentation/overview/account_setup/registration-and-login/
# Data and storage policies: https://portal.osg-htc.org/documentation/overview/references/policy/
# Acknowledgments: https://osg-htc.org/acknowledging
- id: osg-ospool
  title: Open Science Pool (OSPool)
  provider: OSG Consortium
  type: Research access
  summary: Distributed CPU and GPU computing for many independent research jobs. Potential fits include parameter sweeps, model optimization, and separate AI training runs.
  eligibility: Researchers affiliated with U.S. academic institutions may request access. OSG-operated access points also serve U.S. government and nonprofit research projects.
  access: No-cost, fair-share computing without a proposal or fixed allocation. Submit the OSG Portal interest form, discuss the workload in a short facilitator orientation, and register for the assigned access point when instructed.
  status: Rolling
  url: https://osg-htc.org/services/ospool/
  last_checked: "2026-10-25"
  details:
    - "Capacity is predominantly opportunistic, and jobs can be interrupted. Individual jobs should finish or checkpoint within 20 hours."
    - "GPU access depends on available matching resources. Account approval does not reserve GPU hours or guarantee a particular job's completion time."
    - "Proprietary data, HIPAA data, and other privacy-sensitive data must not be stored or processed on OSG-managed resources. Storage is temporary and is not backed up."
    - "Publications should acknowledge OSG and cite its specified resources."

# PI eligibility: https://chameleoncloud.readthedocs.io/en/latest/user/pi_eligibility.html
# Project allocations: https://chameleoncloud.readthedocs.io/en/latest/getting-started/
# NSF confirms no-cost Chameleon and CloudLab access in Section II.B:
# https://www.nsf.gov/funding/opportunities/circ-community-infrastructure-research-computer-information/nsf23-589/solicitation
- id: chameleon-cloud
  title: Chameleon
  provider: Chameleon — National Science Foundation
  type: Research allocations
  summary: Reconfigurable bare-metal and virtual cloud resources, including GPUs, for computer science systems research, education, and emerging applications.
  eligibility: U.S. academic faculty and research staff in supervisory positions may request PI status. Students normally join an eligible supervisor's project. Projects must support open academic computer science research.
  access: Apply for PI eligibility and a project through the Chameleon portal. Approved projects receive a no-cost startup allocation of 20,000 service units for six months; renewals and additional units may be requested.
  status: Rolling
  url: https://chameleoncloud.org/learn/frequently-asked-questions/
  last_checked: "2026-10-25"
  details:
    - "GPU resources require reservations and are scarce. Service units are accounting units, not GPU hours; resource types consume different rates."
    - "Bare-metal and GPU virtual-machine leases normally last at most seven days. Extensions depend on availability; longer exceptions require review."
    - "Research is expected to produce open publications, acknowledge Chameleon and NSF, and comply with the prohibition on commercial use."

# Resource routes: https://docs.alcf.anl.gov/
# No-cost nonproprietary research: https://science.osti.gov/User-Facilities/Frequently-Asked-Questions
# Accounts: https://docs.alcf.anl.gov/account-project-management/accounts-and-access/
# Data policy: https://docs.alcf.anl.gov/policies/data-and-software-policies/data-policy/
# Publications: https://docs.alcf.anl.gov/policies/alcf-acknowledgement-policy/
- id: alcf-directors-discretionary
  title: ALCF Director's Discretionary Allocation Program
  provider: Argonne Leadership Computing Facility — U.S. Department of Energy
  type: Research allocations
  summary: Startup access to leadership computing and AI accelerators for preparing scientific applications for larger allocations or evaluating AI testbed systems.
  eligibility: University researchers may apply; DOE sponsorship is not required. Projects must demonstrate a need for leadership-class resources.
  access: Submit a Director's Discretionary request through the program page. Awards are generally small, project-dependent allocations lasting three to six months, with renewals possible. Nonproprietary research intended for publication is provided without user fees.
  status: Rolling
  url: https://www.alcf.anl.gov/science/directors-discretionary-allocation-program
  last_checked: "2026-10-25"
  details:
    - "Requests can include CPU systems, GPU systems, inference endpoints, or AI testbed resources. The approved systems and allocation determine access."
    - "An allocation is followed by individual account requests and sponsorship; approval does not provide unrestricted access to every system."
    - "Sensitive or national-security data require documented PI and ALCF leadership approval. Export-controlled software is prohibited."
    - "Publications and presentations should acknowledge ALCF, and accepted citations should be reported. AI Testbed users are asked to share paper drafts with ALCF before submission for feedback."

# Project eligibility: https://docs.cloudlab.us/users.html
# Acceptable use: https://cloudlab.us/aup
# Hardware and reservations: https://docs.cloudlab.us/hardware.html
# https://docs.cloudlab.us/reservations.html
- id: cloudlab
  title: CloudLab
  provider: CloudLab — National Science Foundation
  type: Research access
  summary: Bare-metal infrastructure, including GPU-equipped nodes, for experiments on cloud architectures, distributed systems, networking, and applications requiring unusual infrastructure control.
  eligibility: Faculty and senior research staff can lead projects subject to staff approval; students join a faculty-led project. Use must meet CloudLab's research or education requirements.
  access: No-cost experimental research access. Request a project through the CloudLab signup process, then request suitable nodes or reservations. Resource quantity and duration depend on availability and approved requests.
  status: Rolling
  url: https://www.cloudlab.us/
  last_checked: "2026-10-25"
  details:
    - "Systems experiments must advance cloud capabilities or understanding and require infrastructure access, isolation, or specialized capabilities unavailable in traditional clouds. Applications must depend on CloudLab capabilities not generally available elsewhere."
    - "GPU-equipped hardware exists, but project approval does not guarantee GPU availability; reservations may require administrative review."
    - "Commercial use and attacks on CloudLab infrastructure are prohibited. Do not store or transmit data protected by privacy regulations."
