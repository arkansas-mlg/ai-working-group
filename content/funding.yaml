# Full solicitation: https://www.nsf.gov/funding/opportunities/future-core-computer-information-science-engineering-future-computing/nsf25-543/solicitation
- id: nsf-future-core
  title: Future Computing Research (Future CoRe) — NSF 25-543
  provider: NSF — Computer and Information Science and Engineering
  type: Research grant
  summary: Supports foundational computing research, including Robust Intelligence, Algorithmic Foundations, and Cyber-Physical System Foundations and Connected Communities. Potential fits include new AI methods, optimization, and intelligent physical systems.
  eligibility: U.S. institutions of higher education may apply. An individual may participate as PI, co-PI, or senior/key personnel on at most two Future CoRe proposals in any consecutive 12 months; there is no institutional submission limit.
  amount: Up to $1,000,000 total for up to 4 years.
  status: Rolling
  url: https://www.nsf.gov/funding/opportunities/future-core-computer-information-science-engineering-future-computing
  last_checked: "2026-10-24"
  details:
    - "Proposals are accepted anytime. Recommended review-cycle targets are February 4, 2027 and September 9, 2027; these are not deadlines."
    - "Typical projects request approximately $150,000–$250,000 per year for 3–4 years."
    - "CPS and Robust Intelligence are programs within this solicitation."

- id: nsf-foundational-research-robotics
  title: Foundational Research in Robotics (FRR) — PD 20-144Y
  provider: NSF — Engineering and Computer and Information Science and Engineering
  type: Research grant
  summary: Supports fundamental advances in robots that combine computation with physical embodiment. Potential projects could develop new capabilities in sensing, planning, learning, control, and autonomous action.
  eligibility: U.S. institutions of higher education may apply under standard NSF rules. The intellectual contribution must address a fundamental robotics problem and improve the capabilities of a robot or class of robots.
  status: Rolling
  url: https://www.nsf.gov/funding/opportunities/frr-foundational-research-robotics
  last_checked: "2026-10-24"
  details:
    - "Full proposals are accepted anytime."
    - "Discussion with an FRR program officer before submission is strongly encouraged; experimental validation on a physical platform is encouraged."
    - "Declined proposals require substantial revision and a minimum one-year interval from the original submission before resubmission."

# Full solicitation: https://www.nsf.gov/funding/opportunities/nsf-satc-us-national-science-foundation-security-privacy-trust/nsf25-515/solicitation
- id: nsf-satc-research
  title: Security, Privacy, and Trust in Cyberspace — Research (NSF 25-515)
  provider: NSF — Computer and Information Science and Engineering and partner directorates
  type: Research grant
  summary: Supports research on security, privacy, and resilience in interconnected cyber systems. Potential fits include trustworthy AI, AI security, and resilient cyber-physical systems.
  eligibility: U.S. institutions of higher education may apply. PIs, co-PIs, and senior/key personnel must hold a tenured or tenure-track position, or a primary full-time paid research or teaching appointment, at an eligible U.S. institution; each may join at most two RES proposals in a contiguous 12 months.
  amount: Up to $1,200,000 total for up to 4 years.
  status: Rolling
  url: https://www.nsf.gov/funding/opportunities/nsf-satc-us-national-science-foundation-security-privacy-trust
  last_checked: "2026-10-24"
  details:
    - "Proposals are accepted anytime. Recommended review-cycle targets are January 25, 2027 and September 27, 2027; these are not deadlines."
    - "Projects exceeding $600,000 have additional collaboration and broadening-participation planning requirements as applicable."
    - "The overall 12-month individual limit is four SaTC proposals: two RES, one EDU, and one SEED."

- id: nsf-eccs
  title: Electrical, Communications, and Computing Systems (ECCS) — NSF 26-514
  provider: NSF — Directorate for Engineering
  type: Research grant
  summary: Supports foundational electrical, communications, and computing research. Energy, Power, Control, and Learning offers a route for AI and control; Circuits and Systems for Communications and Sensing covers sensing research.
  eligibility: U.S. institutions of higher education may apply under standard NSF rules. The solicitation has no additional PI restrictions or institutional or individual proposal-count limits.
  status: Rolling
  url: https://www.nsf.gov/funding/opportunities/eccs-engineering-electrical-communications-computing-systems/nsf26-514/solicitation
  last_checked: "2026-10-24"
  details:
    - "Proposals are accepted anytime; a letter of intent or preliminary proposal is not required."
    - "Budgets and durations should match the proposed scope; no fixed individual award cap is specified."
    - "Investigators are strongly encouraged to discuss fit with a program director and send a one-page project summary before submitting."

- id: nsf-cmmi
  title: Civil, Mechanical, and Manufacturing Innovation (CMMI) — NSF 26-515
  provider: NSF — Directorate for Engineering
  type: Research grant
  summary: Supports foundational engineering research. Intelligent and Interactive Dynamic Systems covers modeling, inference, control, and human interaction; Advanced Manufacturing, Design, and Operations offers a route for optimization, manufacturing, and supply-chain research.
  eligibility: U.S. institutions of higher education may apply under standard NSF rules. The solicitation has no additional PI restrictions or institutional or individual proposal-count limits.
  status: Rolling
  url: https://www.nsf.gov/funding/opportunities/engineering-eng-civil-mechanical-manufacturing-innovation/nsf26-515/solicitation
