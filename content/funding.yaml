- id: nsf-epscor-e-rise
  title: EPSCoR Research Incubators for STEM Excellence (E-RISE) — NSF 25-522
  provider: NSF — EPSCoR
  type: Collaborative research
  summary: Supports statewide teams pursuing a shared research problem while building research capacity and workforce. Potential fits include interdisciplinary AI research aligned with Arkansas priorities.
  eligibility: Arkansas is eligible. UArk's existing AR-STRIDES E-RISE award restricts a new lead submission. UArk faculty may join another eligible Arkansas organization's proposal as funded participants other than PI/co-PI, with activities distinct from existing awards.
  amount: Up to $8,000,000 total for the initial 4-year project; the amount covers the whole collaboration.
  deadline: "2027-08-10"
  status: Open
  url: https://www.nsf.gov/funding/opportunities/e-rise-epscor-research-infrastructure-improvement-program-epscor
  last_checked: "2026-10-24"
  details:
    - "Full proposals are due August 10, 2027 at 5 p.m. in the submitting organization's local time."
    - "One lead submission per organization; existing E-RISE or RII Track-1 leads are restricted unless in their final year or a nonrenewing extension. PI/co-PI award limits also apply."
    - "Requires a statewide partnership, an active steering committee with current bylaws, an approved S&T plan from the past five years, and notification to that committee. Coordinate with existing Arkansas awards."

