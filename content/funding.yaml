    - "Investigators are strongly encouraged to discuss fit with a program director and send a one-page project summary before submitting."

# Full solicitation: https://www.nsf.gov/funding/opportunities/career-faculty-early-career-development-program/nsf22-586/solicitation
- id: nsf-career
  title: Faculty Early Career Development Program (CAREER) — NSF 22-586
  provider: NSF — Foundation-wide
  type: Early-career award
  summary: Supports an integrated research and education program led by an early-career faculty member. Potential topics include foundational AI, robotics, trustworthy systems, and engineering research aligned with an NSF program.
  eligibility: U.S. institutions of higher education may apply for faculty with a doctoral degree, at least a 50% tenure-track or equivalent assistant-professor appointment, untenured status, and no previous CAREER award. One proposal per annual competition and at most three competitions per PI; co-PIs are not permitted.
  amount: Minimum $400,000 including indirect costs over 5 years; minimum $500,000 for proposals to Engineering, Biological Sciences, or Polar Programs.
  deadline: "2027-07-28"
  status: Open
  url: https://www.nsf.gov/funding/opportunities/career-faculty-early-career-development-program
  last_checked: "2026-10-24"
  details:
    - "Full proposals are due July 28, 2027 at 5 p.m. in the submitting institution's local time."
    - "Research and education activities must be integrated, and a departmental letter is required."
    - "Individual eligibility and prior competition history must be checked against the annual deadline."

# Arkansas eligibility: https://www.nsf.gov/funding/initiatives/epscor/epscor-criteria-eligibility
# Full solicitation: https://www.nsf.gov/funding/opportunities/epscor-research-infrastructure-improvement-epscor-research/nsf24-528/solicitation
- id: nsf-epscor-research-fellows
  title: EPSCoR Research Fellows — NSF track (NSF 24-528)
  provider: NSF — EPSCoR
  type: Faculty fellowship
  summary: Supports faculty visits to research facilities to develop skills and collaborations that strengthen research capacity at the home institution. Potential projects include AI, robotics, and scientific machine learning.
  eligibility: Arkansas institutions of higher education are eligible. At the deadline, PIs must hold a long-term appointment at the lecturer, research-faculty, assistant-professor, or associate-professor level; full professors and postdoctoral fellows are ineligible. Previous or current Research Fellows awardees cannot apply; no co-PIs are allowed.
  amount: Up to $300,000 total over up to 24 months, supporting 1–6 months of research visits.
  deadline: "2027-04-13"
  status: Open
  url: https://www.nsf.gov/funding/opportunities/epscor-research-infrastructure-improvement-epscor-research
  last_checked: "2026-10-24"
  details:
    - "Full proposals are due April 13, 2027 at 5 p.m. in the submitting institution's local time."
    - "The NSF track permits four proposals per institution and one per PI; coordinate institutional selection."
    - "PIs must be positioned to sustain home-institution research capacity beyond the fellowship, generally for at least three years."
    - "The host must be a U.S. research facility outside the PI's current institutional system. Supervisor, host-collaborator, and host-administrator support letters are required."

# Full solicitation: https://www.nsf.gov/funding/opportunities/e-core-epscor-research-infrastructure-improvement-program-epscor/nsf25-523/solicitation
# UArk AR-NETWORK subaward: https://news.uark.edu/articles/79893/ara-awards-u-of-a-1-8-million-to-expand-economic-development-efforts
# Approved 2024 Arkansas S&T plan and jurisdictional steering structure:
# https://www.arkansasedc.com/arkansas-nsf-epscor/division/state-science-technology-plan
- id: nsf-epscor-e-core
  title: EPSCoR Collaborations for Optimizing Research Ecosystems (E-CORE) — NSF 25-523
  provider: NSF — EPSCoR
  type: Research infrastructure
  summary: Supports statewide research infrastructure, workforce, and partnership capacity. Potential fits include shared AI research facilities and networks connecting research to applications.
  eligibility: Arkansas organizations may collaborate. UArk is a funded AR-NETWORK partner; non-lead participation in an existing E-CORE award is permitted. Current E-CORE or RII Track-1 leads face new-lead restrictions but may supply funded participants other than PI/co-PI on another organization's proposal.
  amount: Up to $10,000,000 total for the initial 4-year project; the amount covers the whole collaboration.
  deadline: "2027-07-20"
  status: Open
  url: https://www.nsf.gov/funding/opportunities/e-core-epscor-research-infrastructure-improvement-program-epscor
  last_checked: "2026-10-24"
  details:
    - "Full proposals are due July 20, 2027 at 5 p.m. in the submitting organization's local time."
    - "One lead submission or award per organization and one PI/co-PI role, subject to final-year and nonrenewal exceptions; PIs need at least a 50% eligible appointment. Coordinate any proposed lead role institutionally."
    - "Requires statewide partners, an active steering committee, and an S&T plan updated within five years. Notify the committee and coordinate with existing Arkansas awards; activities must not duplicate current funding."

# Full solicitation: https://www.nsf.gov/funding/opportunities/e-rise-epscor-research-infrastructure-improvement-program-epscor/nsf25-522/solicitation
