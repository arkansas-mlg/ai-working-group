{% extends 'base.html' %}
{% from 'macros.html' import person_card with context %}
{% block content %}
<header class="container page-header">
  <p class="eyebrow">{{ page_meta.eyebrow }}</p>
  {% if page_meta.title %}<h1 class="page-title">{{ page_meta.title }}</h1>{% endif %}
  <p class="page-intro">{{ page_meta.intro }}</p>
</header>
<section class="container page-content" aria-label="Working group members"><div class="people-grid">{% for person in people %}{{ person_card(person) }}{% endfor %}</div></section>
{% endblock %}
